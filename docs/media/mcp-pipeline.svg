<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">Declarative Aseprite Asset MCP pipeline</title>
  <desc id="desc">A style bible feeds a seeded generator, quality gate, and engine-ready exports.</desc>
  <rect width="1200" height="260" rx="24" fill="#12243a"/>
  <g font-family="Segoe UI, sans-serif" fill="#f2e9c9">
    <text x="48" y="48" font-size="24" font-weight="700">Declarative asset pipeline</text>
    <text x="48" y="78" font-size="15" fill="#b9d8df">One compact MCP recipe replaces hundreds of pixel-level calls.</text>
    <g font-size="17" text-anchor="middle">
      <rect x="48" y="120" width="190" height="78" rx="14" fill="#28577a"/><text x="143" y="153">Style Bible</text><text x="143" y="178" font-size="13" fill="#b9d8df">palette · light · seed</text>
      <rect x="288" y="120" width="190" height="78" rx="14" fill="#3081ad"/><text x="383" y="153">Generator</text><text x="383" y="178" font-size="13" fill="#d6f0ee">maps · tiles · waves</text>
      <rect x="528" y="120" width="190" height="78" rx="14" fill="#57975b"/><text x="623" y="153">Quality Gate</text><text x="623" y="178" font-size="13" fill="#e8f4d8">contrast · pixels · edges</text>
      <rect x="768" y="120" width="190" height="78" rx="14" fill="#c49b57"/><text x="863" y="153">Pack</text><text x="863" y="178" font-size="13" fill="#12243a">PNG · GIF · JSON</text>
      <rect x="1008" y="120" width="144" height="78" rx="14" fill="#e2c277"/><text x="1080" y="153" fill="#12243a">Godot</text><text x="1080" y="178" font-size="13" fill="#28577a">TileMapLayer</text>
    </g>
    <g stroke="#f2e9c9" stroke-width="3" fill="none" stroke-linecap="round"><path d="M238 159h42m198 0h42m198 0h42m198 0h42"/><path d="m270 151 10 8-10 8m240-8 10 8-10 8m240-8 10 8-10 8m240-8 10 8-10 8"/></g>
  </g>
</svg>
