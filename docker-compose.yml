services:
  aseprite-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    image: aseprite-mcp:latest
    container_name: aseprite-mcp-server
    restart: unless-stopped
    volumes:
      - .:/app
      # Mount a host Aseprite installation if the MCP must edit files.
      # - /path/to/Aseprite:/opt/aseprite:ro
    environment:
      ASEPRITE_PATH: /opt/aseprite/Aseprite
    stdin_open: true
    tty: true

  # Optional: Add a development service
  aseprite-mcp-dev:
    build:
      context: .
      dockerfile: Dockerfile
    image: aseprite-mcp:latest
    container_name: aseprite-mcp-dev
    volumes:
      - .:/app
    command: ["npm", "run", "test"]
    stdin_open: true
    tty: true
    profiles:
      - dev
