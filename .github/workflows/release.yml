name: Release npm package

# Publishes `aseprite-asset-mcp` to the public npm registry when a GitHub
# Release is published (or when a `v*` tag is pushed).
#
# Required repository secret:
#   NPM_TOKEN - an npm "Automation" access token with publish rights for the
#               `aseprite-asset-mcp` package.
# Configure it in GitHub under:
#   Settings -> Secrets and variables -> Actions -> New repository secret.
# This workflow never hardcodes a token; it only reads `secrets.NPM_TOKEN`.

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for npm provenance

concurrency:
  group: npm-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Guard so a release + tag push (or a re-run) does not try to publish the
      # same version twice.
      - name: Check whether this version is already published
        id: version_check
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "aseprite-asset-mcp@${VERSION}" version >/dev/null 2>&1; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "aseprite-asset-mcp@${VERSION} is already on npm; skipping publish."
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
            echo "aseprite-asset-mcp@${VERSION} is not on npm yet; will publish."
          fi

      - name: Check npm token
        id: token_check
        run: |
          if [ -n "${NPM_TOKEN}" ]; then
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "::warning::NPM_TOKEN secret is not configured; skipping npm publish. Add it in Settings -> Secrets and variables -> Actions."
          fi
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to npm with provenance
        if: steps.version_check.outputs.already_published == 'false' && steps.token_check.outputs.has_token == 'true'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
