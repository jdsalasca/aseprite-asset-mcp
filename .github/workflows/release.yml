name: Release npm package

# Publishes `aseprite-asset-mcp` to the public npm registry when a GitHub
# Release is published (or when a `v*` tag is pushed, or manually).
#
# Authentication, in order of preference:
#   1. Trusted Publishing (OIDC) - recommended, no secrets.
#      Configure it on npmjs.com: package -> Settings -> Trusted Publisher ->
#      GitHub Actions with repository `jdsalasca/aseprite-asset-mcp` and
#      workflow `release.yml`. If the trusted publisher exists, this workflow
#      publishes with provenance automatically.
#   2. NPM_TOKEN - optional repository secret holding an npm Automation token,
#      used only when the OIDC trusted publisher is not configured.
#      Settings -> Secrets and variables -> Actions -> New repository secret.
# The workflow never hardcodes a token.

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for npm trusted publishing / provenance

concurrency:
  group: npm-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Guard so a release + tag push (or a re-run) does not try to publish the
      # same version twice.
      - name: Check whether this version is already published
        id: version_check
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "aseprite-asset-mcp@${VERSION}" version >/dev/null 2>&1; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "aseprite-asset-mcp@${VERSION} is already on npm; skipping publish."
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
            echo "aseprite-asset-mcp@${VERSION} is not on npm yet; will publish."
          fi

      - name: Publish with Trusted Publishing (OIDC)
        if: steps.version_check.outputs.already_published == 'false' && env.NPM_TOKEN == ''
        run: npm publish --provenance --access public

      - name: Publish with NPM_TOKEN
        if: steps.version_check.outputs.already_published == 'false' && env.NPM_TOKEN != ''
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
