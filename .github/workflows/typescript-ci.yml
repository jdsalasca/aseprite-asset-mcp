name: aseprite-mcp-typescript-ci

on:
  push:
    branches: [develop, agent/hexagonal-improvements]
  pull_request:
    branches: [develop]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
